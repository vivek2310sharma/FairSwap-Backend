name: Reusable Supabase CLI release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Approved candidate ID (e.g. moderation-analytics-v1)'
        required: true
        default: 'moderation-analytics-v1'
        type: choice
        options:
          - moderation-analytics-v1
      approved_sha:
        description: 'Exact reviewed commit SHA on main'
        required: true
        type: string
      expected_candidate_sha256:
        description: 'Exact reviewed SHA-256 of candidate migration SQL'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-reusable-supabase-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'vivek2310sharma/FairSwap-Backend' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vivek2310sharma' &&
      github.triggering_actor == 'vivek2310sharma' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Verify 58 historical baseline migrations
        run: node scripts/verify-migration-manifest.mjs

      - name: Run pipeline unit & release guard tests
        run: node --test tests/release/reusable-supabase-release.test.mjs

      - name: Verify candidate registry and candidate SQL SHA-256
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import {verifyCandidateSha, getCandidate} from './scripts/release/reusable-candidates.mjs';
          const candidateId = process.env.CANDIDATE;
          const expectedSha = process.env.EXPECTED_SHA;
          const {sha256} = verifyCandidateSha(candidateId);
          if (sha256 !== expectedSha) {
            throw new Error(`Candidate SHA mismatch: expected ${expectedSha}, got ${sha256}`);
          }
          NODE

      - name: Require successful push CI on exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import {requireCi} from './scripts/release/fsw-sec-003-prelaunch.mjs';
          await requireCi(process.env);
          NODE

  test:
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    environment: FairSwapTest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_sha: ${{ steps.proof.outputs.sha256 }}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Test release and automated read-only verification
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_TEST_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapTest',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - id: proof
        run: |
          file="release-receipts/${{ inputs.candidate }}-fairswaptest.json"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-test-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify_test:
    needs: [verify, test]
    if: ${{ needs.test.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.test.outputs.artifact_id }}
          path: test-evidence
          merge-multiple: true

      - name: Verify Test receipt integrity
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.receipt_sha }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          cd test-evidence
          sha256sum --check SHA256SUMS_fairswaptest
          printf '%s  %s-fairswaptest.json\n' "$EXPECTED_SHA" "$CANDIDATE" | sha256sum --check --status

  production:
    needs: [verify_test, test]
    if: ${{ needs.verify_test.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    environment: FairSwapProd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Production release and automated read-only verification
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_PROD_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapProd',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - name: Upload sanitized, immutable Production migration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-prod-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
