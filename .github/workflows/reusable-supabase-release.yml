name: Reusable Supabase CLI release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Approved candidate ID (e.g. moderation-analytics-v1)'
        required: true
        default: 'moderation-analytics-v1'
        type: choice
        options:
          - moderation-analytics-v1
          - moderation-azure-v1
          - moderation-switching-v1
          - moderation-google-cloud-v1
          - mobile-catalogue-india-v1
          - listing-validity-365
          - taxonomy-v2-foundation
          - taxonomy-v2-catalogue
          - idv-digilocker-v1
          - idv-digilocker-oidc-v2
          # FairSwapTest only: testOnly, never promoted; Production is refused by the registry, the runner and the production job.
          - idv-digilocker-required-gate
          - accessories-v1-foundation
          - accessories-v1-activation
          - tablets-v1-foundation
          - tablets-v1-activation
          - tablets-v2-catalogue
          - wearables-v11-catalogue
          - wearables-v1-foundation
          - wearables-v1-activation
          # Unified Publishing V3: disabled-schema preparation in Test only.
          - ordinary-goods-v3
          - bounded-goods-v3
          - pedal-and-parts-v3
          - property-intake-v3
          - regulated-vehicle-drafts-v3
          - specialist-vehicle-draft-binding-v3
          - v3-require-active-seller-identity
          - v3-test-remaining-batch
          - v3-production-disabled-batch
          - v3-books-activate
          - v3-books-deactivate
          - v3-tables-chairs-activate
          - v3-tables-chairs-deactivate
          - v3-goods-batch-activate
          - v3-goods-batch-deactivate
      v3_batch:
        description: 'V3 Goods Batch (max 5 leaves per dispatch): JSON array of [{candidateId, testActivationRunId?, testE2eRunId?, booksAcceptanceRunId?}]'
        required: false
        type: string
      books_acceptance_run_id:
        description: 'V3 Tables & Chairs: successful Books activation acceptance run in the same environment and Backend commit'
        required: false
        type: string
      approved_sha:
        description: 'Exact reviewed commit SHA on main'
        required: true
        type: string
      expected_candidate_sha256:
        description: 'Candidate SQL SHA-256 or V3 Production manifest SHA-256; leave empty for the pinned V3 Test batch'
        required: false
        type: string
      target:
        description: 'Stage: test (registered automatic-promotion candidates, including Taxonomy V2), production (strict candidates, after Test evidence), or adopt (read-only attestation of an existing registered Production installation)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
          - adopt
      web_staging_sha:
        description: 'Accessories and Tablets: verified Web staging SHA; V2 Production requires successful staging CI and deployment'
        required: false
        type: string
      web_production_sha:
        description: 'Production activation: deployed Web production commit SHA'
        required: false
        type: string
      test_catalogue_run_id:
        description: 'Catalogue Production: successful Test catalogue release run on the same reviewed Backend commit'
        required: false
        type: string
      test_foundation_run_id:
        description: 'Accessories and Tablets: successful Test foundation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      test_activation_run_id:
        description: 'Accessories and Tablets: successful Test activation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      prod_foundation_run_id:
        description: 'Production activation: successful Production foundation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      accessories_prod_foundation_run_id:
        description: 'Wearables Production: successful Accessories Production foundation run ID (prior commit allowed if ancestor)'
        required: false
        type: string
      test_e2e_run_id:
        description: 'Wearables Production: successful Test E2E run ID, or OWNER_APPROVED_WEARABLES_V1_E2E_WAIVER (owner only)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-reusable-supabase-release
  cancel-in-progress: false

jobs:
  verify:
    outputs:
      auto_promote: ${{ steps.plan.outputs.auto_promote }}
      accessories_recovered_foundation_sha: ${{ steps.plan.outputs.accessories_recovered_foundation_sha }}
      accessories_recheck_prod_foundation: ${{ steps.plan.outputs.accessories_recheck_prod_foundation }}
      foundation_ledger_sha: ${{ steps.plan.outputs.foundation_ledger_sha }}
      candidate_ledger_sha: ${{ steps.plan.outputs.candidate_ledger_sha }}
    if: >-
      github.repository == 'vivek2310sharma/FairSwap-Backend' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vivek2310sharma' &&
      (inputs.test_e2e_run_id != 'OWNER_APPROVED_WEARABLES_V1_E2E_WAIVER' ||
        (github.actor_id == '59019804' && github.repository_owner_id == '59019804')) &&
      github.triggering_actor == 'vivek2310sharma' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Verify 58 historical baseline migrations
        run: node scripts/verify-migration-manifest.mjs

      - name: Install isolated Ratings V1 PGlite dependencies
        run: npm ci --prefix tests/ratings --ignore-scripts --no-audit --no-fund

      - name: Run pipeline unit & release guard tests (real PostgreSQL preflight required)
        env:
          REQUIRE_REAL_PG: '1'
          FSW_PGLITE_MODULE: tests/ratings/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/release/reusable-supabase-release.test.mjs

      - name: Verify Taxonomy V2 SQL, pins and release contracts
        if: ${{ inputs.candidate == 'taxonomy-v2-foundation' || inputs.candidate == 'taxonomy-v2-catalogue' }}
        run: |
          node tests/taxonomy-v2/run.mjs --category-count=53
          node tests/taxonomy-v2/run.mjs --category-count=55
          node --test tests/taxonomy-v2/integration.test.mjs tests/release/taxonomy-v2-release.test.mjs tests/release/taxonomy-v2-catalogue-release.test.mjs
          if [[ "${{ inputs.candidate }}" == taxonomy-v2-catalogue ]]; then
            node tests/taxonomy-v2/run.mjs --category-count=53 --package=2
            node tests/taxonomy-v2/run.mjs --category-count=55 --package=2
          fi

      - name: Verify V3 authorization and moderation on disposable fixtures
        if: ${{ inputs.candidate == 'v3-production-disabled-batch' }}
        run: node tests/ordinary-goods/run.mjs

      - name: Verify candidate registry and candidate SQL SHA-256
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module - <<'NODE'
          import {verifyCandidateSha, getCandidate} from './scripts/release/reusable-candidates.mjs';
          const candidateId = process.env.CANDIDATE;
          const expectedSha = process.env.EXPECTED_SHA;
          if (candidateId === 'v3-production-disabled-batch') {
            if (process.env.TARGET !== 'production') throw new Error('V3_PRODUCTION_BATCH_TARGET');
          } else if (candidateId === 'v3-test-remaining-batch') {
            if (process.env.TARGET !== 'test' || expectedSha !== '') throw new Error('V3_BATCH_TEST_ONLY_AND_NO_DIGEST_INPUT');
            for (const id of ['property-intake-v3', 'regulated-vehicle-drafts-v3', 'specialist-vehicle-draft-binding-v3', 'v3-require-active-seller-identity']) {
              const candidate = getCandidate(id);
              const {sha256} = verifyCandidateSha(id);
              if (!candidate.unifiedPublishingV3 || !candidate.testOnly || candidate.autoPromote !== false || candidate.sha256 !== sha256)
                throw new Error('V3_BATCH_CANDIDATE_PIN_INVALID_' + id);
            }
          } else {
            const {sha256} = verifyCandidateSha(candidateId);
            if (sha256 !== expectedSha) throw new Error(`Candidate SHA mismatch: expected ${expectedSha}, got ${sha256}`);
          }
          NODE

      - name: Require successful push CI on exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import {requireCi} from './scripts/release/fsw-sec-003-prelaunch.mjs';
          await requireCi(process.env);
          NODE

      - name: Verify historical V3 Test receipts against the Production manifest
        if: ${{ inputs.candidate == 'v3-production-disabled-batch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import {verifyV3ProductionEvidence} from './scripts/release/v3-production-evidence.mjs';
          verifyV3ProductionEvidence(process.cwd(), process.env.EXPECTED_SHA);
          NODE

      - name: Plan stage and require Web and earlier-stage evidence
        if: ${{ inputs.candidate != 'v3-test-remaining-batch' && inputs.candidate != 'v3-production-disabled-batch' }}
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          BOOKS_ACCEPTANCE_RUN_ID: ${{ inputs.books_acceptance_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          V3_BATCH_JSON: ${{ inputs.v3_batch }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {recoveredFoundationSha, requireStageEvidence, usesLedgerHash} from './scripts/release/accessories-v1-release.mjs';
          import {WEARABLES_ANCESTOR_EVIDENCE, requirePriorCommitEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, context: e, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID, books_acceptance_run_id: e.BOOKS_ACCEPTANCE_RUN_ID,
            v3_batch: e.V3_BATCH_JSON
          }});
          if (plan.candidate.v3Operation || plan.candidate.v3Batch) {
            const {requireLeafEvidence} = await import('./scripts/release/v3-leaf-release.mjs');
            await requireLeafEvidence(plan, e);
            appendFileSync(e.GITHUB_OUTPUT, 'auto_promote=false\n');
            process.exit(0);
          }
          const accessories = plan.candidate.id.startsWith('accessories-v1-');
          const wearables = plan.candidate.id.startsWith('wearables-v1-');
          const receipts = await requireStageEvidence(plan.priorRuns, e, fetch, {
            allowFoundationAncestors: accessories,
            ancestorPolicy: wearables ? WEARABLES_ANCESTOR_EVIDENCE : null
          });
          if (accessories) {
            const previous = recoveredFoundationSha(plan, receipts, e.GITHUB_SHA);
            appendFileSync(e.GITHUB_OUTPUT, `accessories_recovered_foundation_sha=${previous}\n`);
            if (receipts.prod_foundation_run_id?.recoveredFoundationCommit) {
              appendFileSync(e.GITHUB_OUTPUT, 'accessories_recheck_prod_foundation=true\n');
            }
          }
          await requirePriorCommitEvidence(plan, e);
          if (usesLedgerHash(plan.candidate)) {
            const stage = plan.candidate.stage;
            const foundation = plan.target === 'production' ? receipts.prod_foundation_run_id : receipts.test_foundation_run_id;
            const testCandidate = receipts[`test_${stage}_run_id`];
            if (stage === 'activation') appendFileSync(e.GITHUB_OUTPUT, `foundation_ledger_sha=${foundation.ledgerStatementsSha256}\n`);
            if (plan.target === 'production') appendFileSync(e.GITHUB_OUTPUT, `candidate_ledger_sha=${testCandidate.ledgerStatementsSha256}\n`);
          }
          appendFileSync(e.GITHUB_OUTPUT, `auto_promote=${plan.candidate.autoPromote === true}\n`);
          NODE

  test:
    needs: verify
    if: ${{ needs.verify.result == 'success' && inputs.target == 'test' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    environment: FairSwapTest
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.candidate == 'v3-test-remaining-batch' && 45 || startsWith(inputs.candidate, 'v3-goods-batch-') && 30 || 20 }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_sha: ${{ steps.proof.outputs.sha256 }}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        if: ${{ inputs.candidate != 'v3-test-remaining-batch' }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          BOOKS_ACCEPTANCE_RUN_ID: ${{ inputs.books_acceptance_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          V3_BATCH_JSON: ${{ inputs.v3_batch }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          import {verifyTabletsV2Web} from './scripts/release/tablets-v2-release.mjs';
          import {verifyE2eEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, context: e, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID, books_acceptance_run_id: e.BOOKS_ACCEPTANCE_RUN_ID,
            v3_batch: e.V3_BATCH_JSON
          }});
          if (plan.candidate.v3Operation === 'activate' || plan.candidate.v3Batch === 'activate') {
            const {verifyLeafWeb} = await import('./scripts/release/v3-leaf-release.mjs');
            await verifyLeafWeb(plan, e);
          }
          await verifyWebDeployments(plan, e);
          await verifyE2eEvidence(plan, e);
          await verifyTabletsV2Web(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Test release and automated read-only verification
        if: ${{ inputs.candidate != 'v3-test-remaining-batch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEB_EVIDENCE_TOKEN: ${{ (startsWith(inputs.candidate, 'v3-books-') || startsWith(inputs.candidate, 'v3-tables-chairs-') || startsWith(inputs.candidate, 'v3-goods-batch-')) && secrets.CHAT_RELEASE_AUDIT_TOKEN || '' }}
          TARGET: ${{ inputs.target }}
          ACCESSORIES_RECOVERED_FOUNDATION_SHA: ${{ needs.verify.outputs.accessories_recovered_foundation_sha }}
          TABLETS_FOUNDATION_LEDGER_SHA: ${{ needs.verify.outputs.foundation_ledger_sha }}
          TABLETS_CANDIDATE_LEDGER_SHA: ${{ needs.verify.outputs.candidate_ledger_sha }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_TEST_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          BOOKS_ACCEPTANCE_RUN_ID: ${{ inputs.books_acceptance_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          V3_BATCH_JSON: ${{ inputs.v3_batch }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapTest',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - name: Run remaining four V3 migrations sequentially (Test only)
        if: ${{ inputs.candidate == 'v3-test-remaining-batch' && inputs.target == 'test' }}
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_TEST_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
        run: |
          node --input-type=module - <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {getCandidate, verifyCandidateSha} from './scripts/release/reusable-candidates.mjs';
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          if (process.env.TARGET !== 'test') throw new Error('V3_BATCH_TEST_ONLY');
          const ids = ['property-intake-v3', 'regulated-vehicle-drafts-v3', 'specialist-vehicle-draft-binding-v3', 'v3-require-active-seller-identity'];
          const sums = [];
          for (const id of ids) {
            const candidate = getCandidate(id);
            const {sha256} = verifyCandidateSha(id);
            if (!candidate.unifiedPublishingV3 || !candidate.testOnly || candidate.autoPromote !== false || candidate.sha256 !== sha256)
              throw new Error('V3_BATCH_CANDIDATE_PIN_INVALID_' + id);
            // The existing runner performs the per-candidate dry-run, apply, ledger and disabled-contract postflight.
            const receipt = await releaseReusable({
              environment: 'FairSwapTest', candidateId: id,
              context: {...process.env, CANDIDATE: id, EXPECTED_SHA: sha256, TARGET: 'test'},
              receiptDir: 'release-receipts'
            });
            if (!['APPLIED_CLI_LEDGER_POSTFLIGHT_VERIFIED','ALREADY_APPLIED_VERIFIED'].includes(receipt.status) ||
                receipt.postflightVerified !== true || receipt.environment !== 'FairSwapTest' ||
                receipt.projectRef !== 'wpppxlnbzqynvhpeuavd' || receipt.candidateId !== id ||
                receipt.migrationVersion !== candidate.version || receipt.migrationSha256 !== sha256 ||
                receipt.reviewedCommit !== process.env.GITHUB_SHA || receipt.releaseWorkflowRun !== process.env.GITHUB_RUN_ID)
              throw new Error('V3_BATCH_POSTFLIGHT_REJECTED_' + id);
            const name = id + '-fairswaptest.json';
            const data = readFileSync('release-receipts/' + name);
            if (JSON.stringify(JSON.parse(data.toString('utf8'))) !== JSON.stringify(receipt))
              throw new Error('V3_BATCH_RECEIPT_MISMATCH_' + id);
            sums.push(createHash('sha256').update(data).digest('hex') + '  ' + name);
            console.log('V3 Test migration verified: ' + id);
          }
          writeFileSync('release-receipts/SHA256SUMS_fairswaptest', sums.join('\n') + '\n', {mode: 0o600});
          NODE

      - id: proof
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [[ "$CANDIDATE" == 'v3-test-remaining-batch' ]]; then
            file='release-receipts/SHA256SUMS_fairswaptest'
          else
            file="release-receipts/${CANDIDATE}-fairswaptest.json"
          fi
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-test-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify_test:
    needs: [verify, test]
    outputs:
      taxonomy_ledger_sha: ${{ steps.taxonomy_proof.outputs.ledger_sha }}
      listing_validity_ledger_sha: ${{ steps.listing_validity_proof.outputs.ledger_sha }}
      mobile_catalogue_ledger_sha: ${{ steps.mobile_catalogue_proof.outputs.ledger_sha }}
      idv_digilocker_ledger_sha: ${{ steps.idv_digilocker_proof.outputs.ledger_sha }}
    if: ${{ needs.test.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.test.outputs.artifact_id }}
          path: test-evidence
          merge-multiple: true

      - name: Verify Test receipt integrity
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.receipt_sha }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          cd test-evidence
          sha256sum --check SHA256SUMS_fairswaptest
          if [[ "$CANDIDATE" == 'v3-test-remaining-batch' ]]; then
            printf '%s  SHA256SUMS_fairswaptest\n' "$EXPECTED_SHA" | sha256sum --check --status
          else
            printf '%s  %s-fairswaptest.json\n' "$EXPECTED_SHA" "$CANDIDATE" | sha256sum --check --status
          fi

      - name: Verify all four V3 batch receipts
        if: ${{ inputs.candidate == 'v3-test-remaining-batch' }}
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {getCandidate, verifyCandidateSha} from './scripts/release/reusable-candidates.mjs';
          for (const id of ['property-intake-v3', 'regulated-vehicle-drafts-v3', 'specialist-vehicle-draft-binding-v3', 'v3-require-active-seller-identity']) {
            const c = getCandidate(id);
            const {sha256} = verifyCandidateSha(id);
            const r = JSON.parse(readFileSync('test-evidence/' + id + '-fairswaptest.json', 'utf8'));
            if (!['APPLIED_CLI_LEDGER_POSTFLIGHT_VERIFIED','ALREADY_APPLIED_VERIFIED'].includes(r.status) ||
                !r.postflightVerified || r.environment !== 'FairSwapTest' ||
                r.projectRef !== 'wpppxlnbzqynvhpeuavd' || r.candidateId !== id ||
                r.migrationSha256 !== sha256 || r.migrationVersion !== c.version ||
                r.reviewedCommit !== process.env.GITHUB_SHA || r.releaseWorkflowRun !== process.env.GITHUB_RUN_ID)
              throw new Error('V3_BATCH_INDEPENDENT_RECEIPT_INVALID_' + id);
          }
          NODE

      - name: Verify Taxonomy V2 Test postflight receipt
        id: taxonomy_proof
        env:
          TAXONOMY_CANDIDATE: ${{ inputs.candidate }}
        if: ${{ inputs.candidate == 'taxonomy-v2-foundation' || inputs.candidate == 'taxonomy-v2-catalogue' }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {verifyTaxonomyTestReceipt} from './scripts/release/taxonomy-v2-release.mjs';
          import {verifyCatalogueTestReceipt} from './scripts/release/taxonomy-v2-catalogue-release.mjs';
          const id = process.env.TAXONOMY_CANDIDATE;
          const receipt = JSON.parse(readFileSync(`test-evidence/${id}-fairswaptest.json`, 'utf8'));
          const verify = id === 'taxonomy-v2-catalogue' ? verifyCatalogueTestReceipt : verifyTaxonomyTestReceipt;
          const digest = verify(receipt, process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `ledger_sha=${digest}\n`);
          NODE

      - name: Verify listing validity Test postflight receipt
        id: listing_validity_proof
        if: ${{ inputs.candidate == 'listing-validity-365' }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {verifyValidityTestReceipt} from './scripts/release/listing-validity-365-release.mjs';
          const receipt = JSON.parse(readFileSync('test-evidence/listing-validity-365-fairswaptest.json', 'utf8'));
          const digest = verifyValidityTestReceipt(receipt, process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `ledger_sha=${digest}\n`);
          NODE

      - name: Verify Mobile Catalogue Test postflight receipt
        id: mobile_catalogue_proof
        if: ${{ inputs.candidate == 'mobile-catalogue-india-v1' }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {verifyMobileCatalogueTestReceipt} from './scripts/release/reusable-supabase-release.mjs';
          const receipt = JSON.parse(readFileSync('test-evidence/mobile-catalogue-india-v1-fairswaptest.json', 'utf8'));
          const digest = verifyMobileCatalogueTestReceipt(receipt, process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `ledger_sha=${digest}\n`);
          NODE

      - name: Verify IDV DigiLocker V1 Test postflight receipt
        id: idv_digilocker_proof
        if: ${{ inputs.candidate == 'idv-digilocker-v1' || inputs.candidate == 'idv-digilocker-oidc-v2' }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {verifyIdvDigilockerTestReceipt} from './scripts/release/idv-digilocker-v1-release.mjs';
          const receipt = JSON.parse(readFileSync(`test-evidence/${process.env.CANDIDATE}-fairswaptest.json`, 'utf8'));
          const digest = verifyIdvDigilockerTestReceipt(receipt, process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `ledger_sha=${digest}\n`);
          NODE

      - name: Verify IDV DigiLocker required-gate Test receipt (Test only, never promoted)
        if: ${{ inputs.candidate == 'idv-digilocker-required-gate' }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {verifyIdvDigilockerRequiredTestReceipt} from './scripts/release/idv-digilocker-v1-release.mjs';
          verifyIdvDigilockerRequiredTestReceipt(JSON.parse(readFileSync('test-evidence/idv-digilocker-required-gate-fairswaptest.json', 'utf8')), process.env);
          NODE

  production:
    # Moderation, Mobile Catalogue, Listing Validity and Taxonomy: automatic after verified Test. Accessories and Tablets: only a dedicated target=production
    # dispatch, whose Web and earlier-stage Test/Production evidence was already enforced by the verify job.
    # IDV DigiLocker V1 and OIDC V2: automatic only after a verified Test receipt of the same run (never a manual Production dispatch).
    needs: [verify, test, verify_test]
    if: >-
      ${{ always() && needs.verify.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' &&
      inputs.candidate != 'v3-test-remaining-batch' && inputs.candidate != 'idv-digilocker-required-gate' &&
      ((inputs.target == 'test' && needs.verify.outputs.auto_promote == 'true' && needs.test.result == 'success' && needs.verify_test.result == 'success' &&
      (inputs.candidate != 'mobile-catalogue-india-v1' || needs.verify_test.outputs.mobile_catalogue_ledger_sha != '') &&
      (inputs.candidate != 'idv-digilocker-v1' || needs.verify_test.outputs.idv_digilocker_ledger_sha != '') &&
      (inputs.candidate != 'idv-digilocker-oidc-v2' || needs.verify_test.outputs.idv_digilocker_ledger_sha != '') &&
      (inputs.candidate != 'listing-validity-365' || needs.verify_test.outputs.listing_validity_ledger_sha != '') &&
      (inputs.candidate != 'taxonomy-v2-foundation' || needs.verify_test.outputs.taxonomy_ledger_sha != '') &&
      (inputs.candidate != 'taxonomy-v2-catalogue' || needs.verify_test.outputs.taxonomy_ledger_sha != '')) ||
      (inputs.target == 'production' && needs.test.result == 'skipped' && needs.verify_test.result == 'skipped' && inputs.candidate != 'mobile-catalogue-india-v1' && inputs.candidate != 'idv-digilocker-v1' && inputs.candidate != 'idv-digilocker-oidc-v2' && inputs.candidate != 'listing-validity-365' && inputs.candidate != 'taxonomy-v2-foundation' && inputs.candidate != 'taxonomy-v2-catalogue') ||
      (inputs.target == 'adopt' && inputs.candidate == 'accessories-v1-foundation' && needs.test.result == 'skipped' && needs.verify_test.result == 'skipped')) }}
    environment: FairSwapProd
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.candidate == 'v3-production-disabled-batch' && 45 || startsWith(inputs.candidate, 'v3-goods-batch-') && 30 || 20 }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        if: ${{ inputs.candidate != 'v3-production-disabled-batch' }}
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          BOOKS_ACCEPTANCE_RUN_ID: ${{ inputs.books_acceptance_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          V3_BATCH_JSON: ${{ inputs.v3_batch }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          import {verifyTabletsV2Web} from './scripts/release/tablets-v2-release.mjs';
          import {verifyE2eEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, context: e, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID, books_acceptance_run_id: e.BOOKS_ACCEPTANCE_RUN_ID,
            v3_batch: e.V3_BATCH_JSON
          }});
          if (plan.candidate.v3Operation === 'activate' || plan.candidate.v3Batch === 'activate') {
            const {verifyLeafWeb} = await import('./scripts/release/v3-leaf-release.mjs');
            await verifyLeafWeb(plan, e);
          }
          await verifyWebDeployments(plan, e);
          const e2e = await verifyE2eEvidence(plan, e);
          if (plan.e2eWaiver) console.log(JSON.stringify({e2eWaiver: e2e}));
          await verifyTabletsV2Web(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Production release and automated read-only verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAXONOMY_TEST_LEDGER_SHA: ${{ needs.verify_test.outputs.taxonomy_ledger_sha }}
          LISTING_VALIDITY_TEST_LEDGER_SHA: ${{ needs.verify_test.outputs.listing_validity_ledger_sha }}
          MOBILE_CATALOGUE_TEST_LEDGER_SHA: ${{ needs.verify_test.outputs.mobile_catalogue_ledger_sha }}
          IDV_DIGILOCKER_TEST_LEDGER_SHA: ${{ needs.verify_test.outputs.idv_digilocker_ledger_sha }}
          WEB_EVIDENCE_TOKEN: ${{ (inputs.candidate == 'tablets-v2-catalogue' || inputs.candidate == 'wearables-v11-catalogue' || startsWith(inputs.candidate, 'v3-books-') || startsWith(inputs.candidate, 'v3-tables-chairs-') || startsWith(inputs.candidate, 'v3-goods-batch-')) && secrets.CHAT_RELEASE_AUDIT_TOKEN || '' }}
          V3_BATCH_JSON: ${{ inputs.v3_batch }}
          ACCESSORIES_RECHECK_PROD_FOUNDATION: ${{ needs.verify.outputs.accessories_recheck_prod_foundation }}
          ACCESSORIES_RECOVERED_FOUNDATION_SHA: ${{ needs.verify.outputs.accessories_recovered_foundation_sha }}
          TARGET: ${{ inputs.target }}
          TABLETS_FOUNDATION_LEDGER_SHA: ${{ needs.verify.outputs.foundation_ledger_sha }}
          TABLETS_CANDIDATE_LEDGER_SHA: ${{ needs.verify.outputs.candidate_ledger_sha }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_PROD_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          BOOKS_ACCEPTANCE_RUN_ID: ${{ inputs.books_acceptance_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {adoptExistingInstallation, releaseReusable, releaseV3ProductionBatch} from './scripts/release/reusable-supabase-release.mjs';
          const options = {environment: 'FairSwapProd', candidateId: process.env.CANDIDATE, receiptDir: 'release-receipts'};
          // adopt: read-only attestation of an installation that predates the pipeline; applies nothing.
          if (process.env.TARGET === 'adopt') await adoptExistingInstallation(options);
          else if (options.candidateId === 'v3-production-disabled-batch') await releaseV3ProductionBatch(options);
          else await releaseReusable(options);
          NODE

      - name: Upload sanitized, immutable Production migration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-prod-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
