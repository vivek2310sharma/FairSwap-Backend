name: Reusable Supabase CLI release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Approved candidate ID (e.g. moderation-analytics-v1)'
        required: true
        default: 'moderation-analytics-v1'
        type: choice
        options:
          - moderation-analytics-v1
          - moderation-azure-v1
          - accessories-v1-foundation
          - accessories-v1-activation
      approved_sha:
        description: 'Exact reviewed commit SHA on main'
        required: true
        type: string
      expected_candidate_sha256:
        description: 'Exact reviewed SHA-256 of candidate migration SQL'
        required: true
        type: string
      target:
        description: 'Stage: test (moderation also auto-promotes), or production (Accessories only, after Test evidence)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
      web_staging_sha:
        description: 'Accessories: verified matching Web staging commit SHA'
        required: false
        type: string
      web_production_sha:
        description: 'Accessories activation in Production: deployed Web production commit SHA'
        required: false
        type: string
      test_foundation_run_id:
        description: 'Accessories: successful Test foundation run ID'
        required: false
        type: string
      test_activation_run_id:
        description: 'Accessories: successful Test activation run ID'
        required: false
        type: string
      prod_foundation_run_id:
        description: 'Accessories activation in Production: successful Production foundation run ID'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-reusable-supabase-release
  cancel-in-progress: false

jobs:
  verify:
    outputs:
      auto_promote: ${{ steps.plan.outputs.auto_promote }}
    if: >-
      github.repository == 'vivek2310sharma/FairSwap-Backend' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vivek2310sharma' &&
      github.triggering_actor == 'vivek2310sharma' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Verify 58 historical baseline migrations
        run: node scripts/verify-migration-manifest.mjs

      - name: Run pipeline unit & release guard tests (real PostgreSQL preflight required)
        env:
          REQUIRE_REAL_PG: '1'
        run: node --test tests/release/reusable-supabase-release.test.mjs

      - name: Verify candidate registry and candidate SQL SHA-256
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import {verifyCandidateSha, getCandidate} from './scripts/release/reusable-candidates.mjs';
          const candidateId = process.env.CANDIDATE;
          const expectedSha = process.env.EXPECTED_SHA;
          const {sha256} = verifyCandidateSha(candidateId);
          if (sha256 !== expectedSha) {
            throw new Error(`Candidate SHA mismatch: expected ${expectedSha}, got ${sha256}`);
          }
          NODE

      - name: Require successful push CI on exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import {requireCi} from './scripts/release/fsw-sec-003-prelaunch.mjs';
          await requireCi(process.env);
          NODE

      - name: Plan stage and require Web and earlier-stage evidence
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {requireStageEvidence} from './scripts/release/accessories-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID
          }});
          await requireStageEvidence(plan.priorRuns, e);
          appendFileSync(e.GITHUB_OUTPUT, `auto_promote=${plan.candidate.autoPromote === true}\n`);
          NODE

  test:
    needs: verify
    if: ${{ needs.verify.result == 'success' && inputs.target == 'test' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    environment: FairSwapTest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_sha: ${{ steps.proof.outputs.sha256 }}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID
          }});
          await verifyWebDeployments(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Test release and automated read-only verification
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_TEST_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapTest',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - id: proof
        run: |
          file="release-receipts/${{ inputs.candidate }}-fairswaptest.json"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-test-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify_test:
    needs: [verify, test]
    if: ${{ needs.test.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.test.outputs.artifact_id }}
          path: test-evidence
          merge-multiple: true

      - name: Verify Test receipt integrity
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.receipt_sha }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          cd test-evidence
          sha256sum --check SHA256SUMS_fairswaptest
          printf '%s  %s-fairswaptest.json\n' "$EXPECTED_SHA" "$CANDIDATE" | sha256sum --check --status

  production:
    # Moderation: automatic after verified Test (unchanged). Accessories: only a dedicated target=production
    # dispatch, whose Web and earlier-stage Test/Production evidence was already enforced by the verify job.
    needs: [verify, test, verify_test]
    if: >-
      ${{ always() && needs.verify.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' &&
      ((inputs.target == 'test' && needs.verify.outputs.auto_promote == 'true' && needs.test.result == 'success' && needs.verify_test.result == 'success') ||
      (inputs.target == 'production' && needs.test.result == 'skipped' && needs.verify_test.result == 'skipped')) }}
    environment: FairSwapProd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID
          }});
          await verifyWebDeployments(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Production release and automated read-only verification
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_PROD_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapProd',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - name: Upload sanitized, immutable Production migration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-prod-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
