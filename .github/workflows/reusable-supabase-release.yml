name: Reusable Supabase CLI release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Approved candidate ID (e.g. moderation-analytics-v1)'
        required: true
        default: 'moderation-analytics-v1'
        type: choice
        options:
          - moderation-analytics-v1
          - moderation-azure-v1
          - moderation-switching-v1
          - accessories-v1-foundation
          - accessories-v1-activation
          - tablets-v1-foundation
          - tablets-v1-activation
          - tablets-v2-catalogue
          - wearables-v1-foundation
          - wearables-v1-activation
      approved_sha:
        description: 'Exact reviewed commit SHA on main'
        required: true
        type: string
      expected_candidate_sha256:
        description: 'Exact reviewed SHA-256 of candidate migration SQL'
        required: true
        type: string
      target:
        description: 'Stage: test (moderation also auto-promotes), production (strict candidates, after Test evidence), or adopt (read-only attestation of an existing registered Production installation)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
          - adopt
      web_staging_sha:
        description: 'Accessories and Tablets: verified Web staging SHA; V2 Production requires successful staging CI and deployment'
        required: false
        type: string
      web_production_sha:
        description: 'Production activation: deployed Web production commit SHA'
        required: false
        type: string
      test_catalogue_run_id:
        description: 'Tablets V2 Production: successful Test catalogue release run on the same reviewed Backend commit'
        required: false
        type: string
      test_foundation_run_id:
        description: 'Accessories and Tablets: successful Test foundation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      test_activation_run_id:
        description: 'Accessories and Tablets: successful Test activation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      prod_foundation_run_id:
        description: 'Production activation: successful Production foundation run ID (Wearables: verified ancestor commit allowed)'
        required: false
        type: string
      accessories_prod_foundation_run_id:
        description: 'Wearables Production: successful Accessories Production foundation run ID (prior commit allowed if ancestor)'
        required: false
        type: string
      test_e2e_run_id:
        description: 'Wearables Production: successful independent Wearables Test E2E run ID'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-reusable-supabase-release
  cancel-in-progress: false

jobs:
  verify:
    outputs:
      auto_promote: ${{ steps.plan.outputs.auto_promote }}
      accessories_recovered_foundation_sha: ${{ steps.plan.outputs.accessories_recovered_foundation_sha }}
      accessories_recheck_prod_foundation: ${{ steps.plan.outputs.accessories_recheck_prod_foundation }}
      foundation_ledger_sha: ${{ steps.plan.outputs.foundation_ledger_sha }}
      candidate_ledger_sha: ${{ steps.plan.outputs.candidate_ledger_sha }}
    if: >-
      github.repository == 'vivek2310sharma/FairSwap-Backend' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vivek2310sharma' &&
      github.triggering_actor == 'vivek2310sharma' &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Verify 58 historical baseline migrations
        run: node scripts/verify-migration-manifest.mjs

      - name: Run pipeline unit & release guard tests (real PostgreSQL preflight required)
        env:
          REQUIRE_REAL_PG: '1'
        run: node --test tests/release/reusable-supabase-release.test.mjs

      - name: Verify candidate registry and candidate SQL SHA-256
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import {verifyCandidateSha, getCandidate} from './scripts/release/reusable-candidates.mjs';
          const candidateId = process.env.CANDIDATE;
          const expectedSha = process.env.EXPECTED_SHA;
          const {sha256} = verifyCandidateSha(candidateId);
          if (sha256 !== expectedSha) {
            throw new Error(`Candidate SHA mismatch: expected ${expectedSha}, got ${sha256}`);
          }
          NODE

      - name: Require successful push CI on exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import {requireCi} from './scripts/release/fsw-sec-003-prelaunch.mjs';
          await requireCi(process.env);
          NODE

      - name: Plan stage and require Web and earlier-stage evidence
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {recoveredFoundationSha, requireStageEvidence, usesLedgerHash} from './scripts/release/accessories-v1-release.mjs';
          import {WEARABLES_ANCESTOR_EVIDENCE, requirePriorCommitEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID
          }});
          const accessories = plan.candidate.id.startsWith('accessories-v1-');
          const wearables = plan.candidate.id.startsWith('wearables-v1-');
          const receipts = await requireStageEvidence(plan.priorRuns, e, fetch, {
            allowFoundationAncestors: accessories,
            ancestorPolicy: wearables ? WEARABLES_ANCESTOR_EVIDENCE : null
          });
          if (accessories) {
            const previous = recoveredFoundationSha(plan, receipts, e.GITHUB_SHA);
            appendFileSync(e.GITHUB_OUTPUT, `accessories_recovered_foundation_sha=${previous}\n`);
            if (receipts.prod_foundation_run_id?.recoveredFoundationCommit) {
              appendFileSync(e.GITHUB_OUTPUT, 'accessories_recheck_prod_foundation=true\n');
            }
          }
          await requirePriorCommitEvidence(plan, e);
          if (usesLedgerHash(plan.candidate)) {
            const stage = plan.candidate.stage;
            const foundation = plan.target === 'production' ? receipts.prod_foundation_run_id : receipts.test_foundation_run_id;
            const testCandidate = receipts[`test_${stage}_run_id`];
            if (stage === 'activation') appendFileSync(e.GITHUB_OUTPUT, `foundation_ledger_sha=${foundation.ledgerStatementsSha256}\n`);
            if (plan.target === 'production') appendFileSync(e.GITHUB_OUTPUT, `candidate_ledger_sha=${testCandidate.ledgerStatementsSha256}\n`);
          }
          appendFileSync(e.GITHUB_OUTPUT, `auto_promote=${plan.candidate.autoPromote === true}\n`);
          NODE

  test:
    needs: verify
    if: ${{ needs.verify.result == 'success' && inputs.target == 'test' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    environment: FairSwapTest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_sha: ${{ steps.proof.outputs.sha256 }}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          import {verifyTabletsV2Web} from './scripts/release/tablets-v2-release.mjs';
          import {verifyE2eEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID
          }});
          await verifyWebDeployments(plan, e);
          await verifyE2eEvidence(plan, e);
          await verifyTabletsV2Web(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Test release and automated read-only verification
        env:
          ACCESSORIES_RECOVERED_FOUNDATION_SHA: ${{ needs.verify.outputs.accessories_recovered_foundation_sha }}
          TABLETS_FOUNDATION_LEDGER_SHA: ${{ needs.verify.outputs.foundation_ledger_sha }}
          TABLETS_CANDIDATE_LEDGER_SHA: ${{ needs.verify.outputs.candidate_ledger_sha }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_TEST_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          await releaseReusable({
            environment: 'FairSwapTest',
            candidateId: process.env.CANDIDATE,
            receiptDir: 'release-receipts'
          });
          NODE

      - id: proof
        run: |
          file="release-receipts/${{ inputs.candidate }}-fairswaptest.json"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-test-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify_test:
    needs: [verify, test]
    if: ${{ needs.test.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.test.outputs.artifact_id }}
          path: test-evidence
          merge-multiple: true

      - name: Verify Test receipt integrity
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.receipt_sha }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          cd test-evidence
          sha256sum --check SHA256SUMS_fairswaptest
          printf '%s  %s-fairswaptest.json\n' "$EXPECTED_SHA" "$CANDIDATE" | sha256sum --check --status

  production:
    # Moderation: automatic after verified Test (unchanged). Accessories and Tablets: only a dedicated target=production
    # dispatch, whose Web and earlier-stage Test/Production evidence was already enforced by the verify job.
    needs: [verify, test, verify_test]
    if: >-
      ${{ always() && needs.verify.result == 'success' && github.actor == 'vivek2310sharma' && github.triggering_actor == 'vivek2310sharma' &&
      ((inputs.target == 'test' && needs.verify.outputs.auto_promote == 'true' && needs.test.result == 'success' && needs.verify_test.result == 'success') ||
      (inputs.target == 'production' && needs.test.result == 'skipped' && needs.verify_test.result == 'skipped') ||
      (inputs.target == 'adopt' && inputs.candidate == 'accessories-v1-foundation' && needs.test.result == 'skipped' && needs.verify_test.result == 'skipped')) }}
    environment: FairSwapProd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout trusted code on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Verify deployed Web release before any database change (fail closed)
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TARGET: ${{ inputs.target }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
          WEB_EVIDENCE_TOKEN: ${{ secrets.CHAT_RELEASE_AUDIT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import {planDispatch} from './scripts/release/reusable-candidates.mjs';
          import {verifyWebDeployments} from './scripts/release/accessories-v1-release.mjs';
          import {verifyTabletsV2Web} from './scripts/release/tablets-v2-release.mjs';
          import {verifyE2eEvidence} from './scripts/release/wearables-v1-release.mjs';
          const e = process.env;
          const plan = planDispatch({candidateId: e.CANDIDATE, target: e.TARGET, inputs: {
            web_staging_sha: e.WEB_STAGING_SHA, web_production_sha: e.WEB_PRODUCTION_SHA,
            test_catalogue_run_id: e.TEST_CATALOGUE_RUN_ID,
            test_foundation_run_id: e.TEST_FOUNDATION_RUN_ID, test_activation_run_id: e.TEST_ACTIVATION_RUN_ID,
            prod_foundation_run_id: e.PROD_FOUNDATION_RUN_ID,
            accessories_prod_foundation_run_id: e.ACCESSORIES_PROD_FOUNDATION_RUN_ID, test_e2e_run_id: e.TEST_E2E_RUN_ID
          }});
          await verifyWebDeployments(plan, e);
          await verifyE2eEvidence(plan, e);
          await verifyTabletsV2Web(plan, e);
          NODE

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install pinned Supabase CLI
        run: bash scripts/release/install-inbox-cli.sh

      - name: Execute Production release and automated read-only verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEB_EVIDENCE_TOKEN: ${{ inputs.candidate == 'tablets-v2-catalogue' && secrets.CHAT_RELEASE_AUDIT_TOKEN || '' }}
          ACCESSORIES_RECHECK_PROD_FOUNDATION: ${{ needs.verify.outputs.accessories_recheck_prod_foundation }}
          ACCESSORIES_RECOVERED_FOUNDATION_SHA: ${{ needs.verify.outputs.accessories_recovered_foundation_sha }}
          TARGET: ${{ inputs.target }}
          TABLETS_FOUNDATION_LEDGER_SHA: ${{ needs.verify.outputs.foundation_ledger_sha }}
          TABLETS_CANDIDATE_LEDGER_SHA: ${{ needs.verify.outputs.candidate_ledger_sha }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FAIRSWAP_PROD_SUPABASE_ACCESS_TOKEN }}
          CHAT_DATABASE_PASSWORD: ${{ secrets.CHAT_DATABASE_PASSWORD }}
          CHAT_DB_SSL_ROOT_CERT_PEM: ${{ secrets.CHAT_DB_SSL_ROOT_CERT_PEM }}
          CHAT_DB_POOLER_HOST: ${{ vars.CHAT_DB_POOLER_HOST }}
          WEB_STAGING_SHA: ${{ inputs.web_staging_sha }}
          WEB_PRODUCTION_SHA: ${{ inputs.web_production_sha }}
          TEST_CATALOGUE_RUN_ID: ${{ inputs.test_catalogue_run_id }}
          TEST_FOUNDATION_RUN_ID: ${{ inputs.test_foundation_run_id }}
          TEST_ACTIVATION_RUN_ID: ${{ inputs.test_activation_run_id }}
          PROD_FOUNDATION_RUN_ID: ${{ inputs.prod_foundation_run_id }}
          ACCESSORIES_PROD_FOUNDATION_RUN_ID: ${{ inputs.accessories_prod_foundation_run_id }}
          TEST_E2E_RUN_ID: ${{ inputs.test_e2e_run_id }}
        run: |
          node --input-type=module - <<'NODE'
          import {adoptExistingInstallation, releaseReusable} from './scripts/release/reusable-supabase-release.mjs';
          const options = {environment: 'FairSwapProd', candidateId: process.env.CANDIDATE, receiptDir: 'release-receipts'};
          // adopt: read-only attestation of an installation that predates the pipeline; applies nothing.
          if (process.env.TARGET === 'adopt') await adoptExistingInstallation(options);
          else await releaseReusable(options);
          NODE

      - name: Upload sanitized, immutable Production migration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reusable-prod-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-receipts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
