name: Backend independent CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs only; never cancel the run that records a main commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Relevant-change filter for the two Docker PG15 jobs. Fails open: only the literal output "false"
  # (computed from the complete PR file list) lets backend-ci-success accept a skipped job.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pg15: ${{ steps.areas.outputs.pg15 }}
      forward: ${{ steps.areas.outputs.forward }}
    steps:
      - name: Checkout filter script only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/changed-areas.mjs
          sparse-checkout-cone-mode: false
      - name: Classify changed files (fail-open)
        id: areas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/ci/changed-areas.mjs

  unit-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Enable Corepack for the pnpm dependency cache
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: 3
        with:
          node-version: '24.15.0'
          check-latest: false
          cache: pnpm

      - name: Verify runtime and package pins
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pins = JSON.parse(readFileSync('scripts/ci/toolchain.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.versions.node !== pins.node) throw new Error('Node version mismatch');
          if (pkg.packageManager !== `pnpm@${pins.pnpm}` || pkg.engines.pnpm !== pins.pnpm) throw new Error('pnpm pin mismatch');
          for (const [name, version] of Object.entries(pins.packages)) {
            if ((pkg.dependencies?.[name] ?? pkg.devDependencies?.[name]) !== version) throw new Error('Package pin mismatch');
          }
          const pnpm = execFileSync('corepack', ['pnpm', '--version'], { encoding: 'utf8' }).trim();
          if (pnpm !== pins.pnpm) throw new Error('pnpm runtime mismatch');
          console.log(`Verified Node ${pins.node}, pnpm ${pnpm} and package pins`);
          NODE

      - name: Install frozen dependencies without lifecycle scripts
        timeout-minutes: 4
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Verify approved migration bytes (no database execution)
        timeout-minutes: 1
        run: node scripts/ci/verify-baseline.mjs

      - name: Verify pinned Production-hidden category release plan (static only)
        timeout-minutes: 2
        run: |
          node scripts/ci/verify-production-category-release.mjs
          node --test scripts/ci/verify-production-category-release.test.mjs

      - name: Typecheck
        timeout-minutes: 2
        run: corepack pnpm typecheck

      - name: DigiLocker OIDC and Lab security regressions
        timeout-minutes: 4
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            corepack pnpm test:idv

      - name: Install isolated Ratings V1 PGlite dependencies
        timeout-minutes: 3
        run: npm ci --prefix tests/ratings --ignore-scripts --no-audit --no-fund

      - name: Verify FairSwap branding templates and protected auth placeholders (offline)
        timeout-minutes: 3
        run: node scripts/verify-email-branding.mjs

      - name: Ratings V1 offline contract and PGlite regression
        timeout-minutes: 8
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node --experimental-strip-types --test tests/ratings/contract.test.mjs
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node --test tests/ratings/auth-sessions.test.mjs tests/ratings/auth-test-only.test.mjs
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node tests/ratings/run.mjs
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --moduleResolution Bundler --module ESNext src/lib/ratings/contract.ts src/lib/ratings/score.ts

      - name: Require Posting V2.1.2 fixture and CI contract regressions
        timeout-minutes: 2
        run: |
          node --test tests/posting-v212/ci-contract.test.mjs
          node scripts/ci/test-posting-v2.mjs --pglite-module=tests/ratings/node_modules/@electric-sql/pglite/dist/index.js

      - name: Require Accessories V1 SQL and security regressions
        timeout-minutes: 5
        run: node scripts/ci/test-accessories-v1.mjs --pglite-module=tests/ratings/node_modules/@electric-sql/pglite/dist/index.js

      - name: Require Tablets V1 SQL and protected phone wrapper regressions
        timeout-minutes: 6
        run: |
          node scripts/ci/test-tablets-v1.mjs tests/ratings --with-accessories
          node scripts/ci/test-tablet-phone-wrapper.mjs tests/ratings

      - name: Require Wearables V1 SQL, catalogue, RLS and cross-category PGlite regressions
        timeout-minutes: 9
        run: |
          PG=tests/ratings/node_modules/@electric-sql/pglite/dist/index.js
          WEB="$GITHUB_WORKSPACE/tests/wearables-v1/web-fixture"
          node scripts/ci/test-wearables-v1.mjs --pglite-module="$PG" --web="$WEB"
          node scripts/ci/test-wearables-tablets-v1.mjs --pglite-module="$PG" --web="$WEB"

      - name: Require Wearables V1.1 frozen-input parity, update, coexistence and release gates
        timeout-minutes: 12
        run: |
          node --test tests/wearables-v11/ci-contract.test.mjs
          WEB="$GITHUB_WORKSPACE/tests/wearables-v11/web-fixture"
          PG=tests/ratings/node_modules/@electric-sql/pglite/dist/index.js
          node scripts/ci/test-wearables-v1.mjs --catalogue-update --pglite-module="$PG" --web="$WEB"
          node scripts/ci/test-wearables-tablets-v1.mjs --catalogue-update --pglite-module="$PG" --web="$WEB"
          node --test tests/release/reusable-supabase-release.test.mjs
          node --test tests/release/private-release-workflows.test.mjs

      - name: Require all 115 public search regression checks (pinned PGlite)
        timeout-minutes: 2
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node tests/fsw-sec-003/run-disposable.mjs \
            --pglite-module tests/ratings/node_modules/@electric-sql/pglite/dist/index.js
          node --test tests/fsw-sec-003/release-gate.test.mjs tests/fsw-sec-003/protected-release.test.mjs tests/fsw-sec-003/evidence-audit.test.mjs

      - name: Require listing validity 365-day SQL and authorization regressions
        timeout-minutes: 2
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node scripts/ci/test-listing-validity-365.mjs --pglite-module=tests/ratings/node_modules/@electric-sql/pglite/dist/index.js
          node --test tests/release/listing-validity-365-release.test.mjs

      - name: Require Taxonomy V2 foundation SQL and release contract regressions
        timeout-minutes: 3
        run: |
          node tests/taxonomy-v2/run.mjs --category-count=53
          node tests/taxonomy-v2/run.mjs --category-count=55
          node --test tests/taxonomy-v2/integration.test.mjs tests/release/taxonomy-v2-release.test.mjs tests/release/taxonomy-v2-catalogue-release.test.mjs
          node tests/taxonomy-v2/run.mjs --category-count=53 --package=2
          node tests/taxonomy-v2/run.mjs --category-count=55 --package=2

      - name: Verify HDR-03 Production package hashes and network-disabled PGlite contract
        timeout-minutes: 3
        run: |
          node releases/production/hdr-03/verify-package.mjs
          sudo unshare --net -- env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            node releases/production/hdr-03/verify-package.mjs \
            --pglite-module "$GITHUB_WORKSPACE/tests/ratings/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Run validator regression checks
        timeout-minutes: 1
        run: node --test scripts/ci/verification.test.mjs scripts/ci/changed-areas.test.mjs

      - name: Run the five unit files with network-blocking setup
        id: unit
        timeout-minutes: 3
        run: |
          node scripts/ci/verify-unit-results.mjs --check-isolation
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            corepack pnpm test:unit --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/backend-unit-results.json"

      - name: Verify exact results and create sanitized summary
        id: results
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        timeout-minutes: 1
        run: |
          node scripts/ci/verify-unit-results.mjs "$RUNNER_TEMP/backend-unit-results.json" \
            --summary "$RUNNER_TEMP/backend-ci-artifacts/unit-summary.json"

      - name: Upload sanitized unit summary only
        if: ${{ !cancelled() && steps.results.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: backend-unit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-ci-artifacts/unit-summary.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  database-pg15:
    needs: [unit-integrity, changes]
    if: ${{ needs.changes.outputs.pg15 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Set up pinned Node for database validators
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: 3
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Check database validators and shell syntax without starting services
        timeout-minutes: 2
        run: |
          bash -n scripts/ci/run-local-db.sh
          node --test scripts/ci/db-verification.test.mjs

      - name: Reconstruct and verify isolated local PG15 only
        id: database
        timeout-minutes: 25
        run: |
          timeout --signal=TERM --kill-after=30s 20m \
            bash scripts/ci/run-local-db.sh "$RUNNER_TEMP/backend-db-evidence"

      - name: Require complete sanitized database evidence and checksums
        if: ${{ !cancelled() && steps.database.outcome != 'skipped' }}
        timeout-minutes: 1
        run: node scripts/ci/verify-db-results.mjs --verify "$RUNNER_TEMP/backend-db-evidence"

      - name: Upload only allowlisted sanitized database evidence
        if: ${{ always() && steps.database.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: backend-database-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-db-evidence/result.json
            ${{ runner.temp }}/backend-db-evidence/suite-results.json
            ${{ runner.temp }}/backend-db-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  forward-db-pg15:
    needs: [unit-integrity, changes]
    if: ${{ needs.changes.outputs.forward == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Fail closed if hosted Supabase/database settings are present
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_SERVICE_KEY \
                   SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_JWT_SECRET NEXT_PUBLIC_SUPABASE_URL \
                   DATABASE_URL POSTGRES_URL PGHOST PGHOSTADDR PGPASSWORD PGSERVICE PGSERVICEFILE \
                   MODERATION_ANALYTICS_DB_URL PROFILE_ONBOARDING_DB_URL; do
            if [[ -n "${!v:-}" ]]; then echo "FAIL: $v must not be set in this job" >&2; exit 1; fi
          done

      - name: Verify immutable 58-migration baseline manifest
        run: node scripts/verify-migration-manifest.mjs

      - name: Shell syntax and static scans (reusable release tests run once in unit-integrity)
        run: |
          bash -n scripts/ci/run-forward-packages-db.sh
          node --check scripts/ci/run-moderation-analytics-tests.mjs
          node --check scripts/ci/run-profile-onboarding-tests.mjs
          node --check scripts/release/reusable-candidates.mjs
          node --check scripts/release/reusable-supabase-release.mjs

      - name: Run each forward-package pgTAP suite on its own clean throwaway loopback-only Supabase database
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" RUNNER_TEMP="$RUNNER_TEMP" \
            timeout --signal=TERM --kill-after=30s 25m bash scripts/ci/run-forward-packages-db.sh

  ratings-native-pg17:
    needs: unit-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ratings-readiness: ${{ steps.ratings-readiness.outcome }}
      inbox-contracts: ${{ steps.inbox-contracts.outcome }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false
          cache: pnpm
      - name: Frozen dependencies, no lifecycle scripts
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts --engine-strict
          npm ci --prefix tests/ratings --ignore-scripts --no-audit --no-fund
      - name: Install checksum-pinned native PostgreSQL 17.6
        timeout-minutes: 10
        run: bash scripts/ci/install-prebuilt-pg17.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source"
      - name: Verify fail-closed release and mandatory CI contracts
        run: |
          node --test releases/candidates/ratings-v1-final-release/ci-contract.test.mjs
          bash -n releases/candidates/ratings-v1-final-release/run-pg17.sh
      - name: Require both hosted-readiness suites and HDR-03 negative regressions
        id: ratings-readiness
        timeout-minutes: 8
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            bash releases/candidates/ratings-v1-final-release/run-pg17.sh \
            "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Require Posting V2.1.2 native PG17 multi-connection regressions
        timeout-minutes: 7
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            bash tests/posting-v212/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            bash tests/posting-v212/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin" --accessories-v1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            bash tests/tablets-v1/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Require Wearables V1 native PG17 ownership, concurrency and Tablet race regressions
        timeout-minutes: 7
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            bash tests/wearables-v1/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin" --web="$GITHUB_WORKSPACE/tests/wearables-v1/web-fixture"

      - name: Require Taxonomy V2 native PG17 SQL and independent-connection races
        timeout-minutes: 4
        run: |
          node tests/taxonomy-v2/run.mjs --category-count=53 --native-bin="$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"
          node tests/taxonomy-v2/run.mjs --category-count=55 --native-bin="$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"
          node tests/taxonomy-v2/run.mjs --category-count=53 --package=2 --native-bin="$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"
          node tests/taxonomy-v2/run.mjs --category-count=55 --package=2 --native-bin="$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Require Accessories V1 release guards on native PostgreSQL 17
        timeout-minutes: 4
        env:
          REQUIRE_REAL_PG: '1'
          FSW_TEST_PG_BIN: ${{ github.workspace }}/artifacts/ratings/pg17-source/install/bin
        run: node --test tests/release/reusable-supabase-release.test.mjs

      - name: Ratings independent-session PostgreSQL regression (DTO contract and tsc run once in unit-integrity)
        run: |
          bash tests/ratings/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Install checksum-pinned disposable PostgREST
        timeout-minutes: 2
        run: node tests/fsw-sec-003/install-postgrest.mjs
      - name: Require native PostgreSQL 17.6 public search regression
        timeout-minutes: 4
        run: |
          bash tests/fsw-sec-003/run-native.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Install existing checksum-pinned Supabase CLI once for disposable rehearsals
        timeout-minutes: 2
        run: bash scripts/release/install-inbox-cli.sh
      - name: Require authentic CLI ledger, fetch, dry-run and capture contract
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            node tests/fsw-sec-003/cli-rehearsal.mjs \
            "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin" "$(command -v supabase)"

      - name: Require IDV native PG17 migration, RLS and Production v3-to-v1 assertions
        timeout-minutes: 10
        run: bash scripts/ci/run-idv-pg17.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Require HDR-03 role, RLS, count and signal assertions on native PG17
        timeout-minutes: 3
        run: bash scripts/ci/run-hdr03-pg17.sh "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

      - name: Verify Chat inbox canonical sources and install isolated pinned PostgreSQL-in-WASM engine
        run: |
          test -f releases/candidates/chat-v2-inbox-only/manifest.json
          test -f releases/candidates/chat-v2-inbox-only/supabase/migrations/20261025204922_chat_v2_inbox_and_safety.sql
          test -f scripts/ci/test-chat-v2-inbox-only.mjs
          test -f scripts/release/chat-v2-inbox-only.mjs
          test -f tests/chat-v2-inbox-only/renderer.test.mjs
          node --check scripts/ci/test-chat-v2-inbox-only.mjs
          node --check scripts/release/chat-v2-inbox-only.mjs
          corepack pnpm --dir tests/chat-v2-inbox-only install --frozen-lockfile --ignore-scripts --engine-strict

      - name: Require all inbox-only PostgreSQL security and compatibility checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node scripts/ci/test-chat-v2-inbox-only.mjs | tee "$RUNNER_TEMP/chat-v2-inbox-only-tests.log"
          grep -Fq "PASS 34 independent Chat V2 inbox-only PostgreSQL checks." "$RUNNER_TEMP/chat-v2-inbox-only-tests.log"

      - name: Require all four isolated release renderer tests
        id: inbox-contracts
        run: |
          env -i PATH="$PATH" HOME="$HOME" CI=true TMPDIR="$RUNNER_TEMP" \
            node --test --test-reporter=tap tests/chat-v2-inbox-only/renderer.test.mjs | tee "$RUNNER_TEMP/chat-v2-renderer-tests.log"
          grep -Eq '^# tests 4$' "$RUNNER_TEMP/chat-v2-renderer-tests.log"
          grep -Eq '^# pass 4$' "$RUNNER_TEMP/chat-v2-renderer-tests.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/chat-v2-renderer-tests.log"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/chat-v2-renderer-tests.log"
      - run: node --test tests/chat-v2-inbox-only/protected-release.test.mjs tests/chat-v2-inbox-only/readonly-audit.test.mjs
      - name: Run native inbox and CLI fixtures on the shared pinned PostgreSQL 17.6 install
        run: bash scripts/ci/run-chat-inbox-pg17.sh --pg-bin "$GITHUB_WORKSPACE/artifacts/ratings/pg17-source/install/bin"

  ratings-hosted-readiness-pg17:
    needs: ratings-native-pg17
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require the shared native PostgreSQL readiness suite to succeed
        env:
          NATIVE_RESULT: ${{ needs.ratings-native-pg17.result }}
          READINESS_OUTCOME: ${{ needs.ratings-native-pg17.outputs.ratings-readiness }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$NATIVE_RESULT" == success && "$READINESS_OUTCOME" == success ]]'

  # Keeps the existing required status-check context name for the Chat inbox gate.
  chat-inbox-native-pg17:
    needs: ratings-native-pg17
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require all shared-runner inbox checks
        env:
          NATIVE_RESULT: ${{ needs.ratings-native-pg17.result }}
          INBOX_OUTCOME: ${{ needs.ratings-native-pg17.outputs.inbox-contracts }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: '[[ "$NATIVE_RESULT" == success && "$INBOX_OUTCOME" == success ]]'

  backend-ci-success:
    needs: [changes, unit-integrity, database-pg15, forward-db-pg15, ratings-native-pg17, chat-inbox-native-pg17, ratings-hosted-readiness-pg17]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed; a skip passes only when proven irrelevant
        timeout-minutes: 1
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PG15_RELEVANT: ${{ needs.changes.outputs.pg15 }}
          FORWARD_RELEVANT: ${{ needs.changes.outputs.forward }}
          UNIT_RESULT: ${{ needs.unit-integrity.result }}
          DATABASE_RESULT: ${{ needs.database-pg15.result }}
          FORWARD_RESULT: ${{ needs.forward-db-pg15.result }}
          PG17_RESULT: ${{ needs.ratings-native-pg17.result }}
          RATINGS_READINESS_RESULT: ${{ needs.ratings-hosted-readiness-pg17.result }}
          CHAT_INBOX_RESULT: ${{ needs.chat-inbox-native-pg17.result }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # success always passes; skipped passes only if the filter job succeeded and printed the literal "false".
          skip_proven() { [[ "$1" == success || ( "$1" == skipped && "$CHANGES_RESULT" == success && "$2" == false ) ]]; }
          [[ "$CHANGES_RESULT" == success && "$UNIT_RESULT" == success && "$PG17_RESULT" == success && "$RATINGS_READINESS_RESULT" == success && "$CHAT_INBOX_RESULT" == success ]] || exit 1
          skip_proven "$DATABASE_RESULT" "$PG15_RELEVANT" || exit 1
          skip_proven "$FORWARD_RESULT" "$FORWARD_RELEVANT" || exit 1
