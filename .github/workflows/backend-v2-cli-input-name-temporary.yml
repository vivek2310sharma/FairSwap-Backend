name: TEMP V2 input-validation CLI name (remove after proof)
on:
  pull_request:
    branches:
      - feat/moderation-v2-private-foundation
permissions:
  contents: read
jobs:
  generate-cli-filename:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate with approved SHA-256 pinned CLI in task temp only
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          task="$(mktemp -d "$RUNNER_TEMP/fairswap-v2-input-cli.XXXXXXXX")"
          trap 'rm -rf "$task"' EXIT
          node --input-type=module - "$task/pins" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('scripts/ci/toolchain.json','utf8')).database;
          if (pins.cliArchive !== 'https://github.com/supabase/cli/releases/download/v2.117.0/supabase_linux_amd64.tar.gz') process.exit(1);
          writeFileSync(process.argv[2], pins.cliArchive+'\n'+pins.cliArchiveSha256+'\n');
          NODE
          mapfile -t pins < "$task/pins"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "${pins[0]}" --output "$task/supabase.tar.gz"
          printf '%s  %s\n' "${pins[1]}" "$task/supabase.tar.gz" | sha256sum -c -
          tar -xzf "$task/supabase.tar.gz" -C "$task" supabase
          chmod 700 "$task/supabase"
          [[ "$("$task/supabase" --version)" == "2.117.0" ]]
          mkdir -p "$task/local/supabase"
          cd "$task/local"
          "$task/supabase" migration new moderation_v2_input_validation > "$task/create.log"
          mapfile -t generated < <(find "$task/local/supabase/migrations" -maxdepth 1 -type f -name '*_moderation_v2_input_validation.sql' -printf '%f\n')
          [[ "${#generated[@]}" == 1 && "${generated[0]}" =~ ^[0-9]{14}_moderation_v2_input_validation\.sql$ ]]
          echo "PINNED_CLI_GENERATED_FILE=${generated[0]}"
          echo "CLI filename proven; no source changes, DB access or deploy."
