name: Deploy Azure Moderation ACA (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (test or prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'test' && 'FairSwapTest' || inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_MODERATION_SECRET: ${{ secrets.AZURE_MODERATION_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID OPENAI_API_KEY AZURE_MODERATION_SECRET SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!secret_name}" ]]; then
              printf '::error::Missing required secret: %s\n' "$secret_name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment specific variables
        id: env-vars
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "STORAGE_HOST=kriuhwppxgxsyyrbjsau.supabase.co" >> $GITHUB_OUTPUT
          else
            echo "STORAGE_HOST=wpppxlnbzqynvhpeuavd.supabase.co" >> $GITHUB_OUTPUT
          fi
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Ensure Resource Group exists
      - name: Ensure Resource Group Exists
        run: |
          az group create --name rg-fairswap-moderation-${{ inputs.environment }} --location centralindia

      # Step 2: Provision Azure Container Registry via acr.bicep
      - name: Provision Azure Container Registry
        id: acr-deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-fairswap-moderation-${{ inputs.environment }}
          template: infra/azure/moderation/acr.bicep
          parameters: >-
            environment=${{ inputs.environment }}
            location=centralindia

      # Step 3: Log in to provisioned ACR
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.acr-deploy.outputs.acrName }}

      # Step 4: Build and Push immutable container images to ACR
      - name: Build and Push Controller Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/controller
          file: ./services/moderation-azure/controller/Dockerfile
          push: true
          tags: |
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/moderation-controller:${{ steps.env-vars.outputs.IMAGE_TAG }}
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/moderation-controller:latest

      - name: Build and Push Node Vision Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/node-vision
          file: ./services/moderation-azure/node-vision/Dockerfile
          push: true
          tags: |
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/node-vision:${{ steps.env-vars.outputs.IMAGE_TAG }}
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/node-vision:latest

      - name: Build and Push Python OCR Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/python-ocr
          file: ./services/moderation-azure/python-ocr/Dockerfile
          push: true
          tags: |
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/python-ocr:${{ steps.env-vars.outputs.IMAGE_TAG }}
            ${{ steps.acr-deploy.outputs.acrLoginServer }}/python-ocr:latest

      # Step 5: Deploy full Container Apps infrastructure referencing real images
      - name: Deploy Azure Container Apps via main.bicep
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-fairswap-moderation-${{ inputs.environment }}
          template: infra/azure/moderation/main.bicep
          parameters: >-
            environment=${{ inputs.environment }}
            location=centralindia
            openAiApiKey=${{ secrets.OPENAI_API_KEY }}
            moderationSecret=${{ secrets.AZURE_MODERATION_SECRET }}
            allowedStorageHost=${{ steps.env-vars.outputs.STORAGE_HOST }}
            imageTag=${{ steps.env-vars.outputs.IMAGE_TAG }}

      - name: Verify Azure controller health
        if: ${{ inputs.environment == 'test' }}
        shell: bash
        timeout-minutes: 3
        env:
          CONTROLLER_FQDN: ${{ steps.bicep.outputs.controllerFqdn }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --retry-max-time 120 \
            "https://${CONTROLLER_FQDN:?Missing controller FQDN}/healthz"

      # Step 6: Configure required Azure Moderation secrets in Supabase
      - name: Configure Supabase Azure Moderation secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_MODERATION_SECRET: ${{ secrets.AZURE_MODERATION_SECRET }}
          CONTROLLER_FQDN: ${{ steps.bicep.outputs.controllerFqdn }}
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            PROJECT_REF="kriuhwppxgxsyyrbjsau"
          else
            PROJECT_REF="wpppxlnbzqynvhpeuavd"
          fi

          # Install pinned Supabase CLI without running package scripts
          CLI_DIR="$(mktemp -d "${RUNNER_TEMP:?}/supabase-cli.XXXXXX")"
          curl -fsSL \
            --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --retry-max-time 180 \
            https://github.com/supabase/cli/releases/download/v2.117.0/supabase_linux_amd64.tar.gz \
            -o "$CLI_DIR/supabase.tar.gz"
          tar -xzf "$CLI_DIR/supabase.tar.gz" -C "$CLI_DIR" || exit 1
          chmod +x "$CLI_DIR/supabase"
          cli_version="$("$CLI_DIR/supabase" --version)" || exit 1
          if [[ "$cli_version" != "2.117.0" ]]; then
            echo "::error::Expected Supabase CLI version 2.117.0"
            exit 1
          fi

          # Set Azure Moderation secrets (Controller endpoint and secret) in Edge runtime
          "$CLI_DIR/supabase" secrets set \
            AZURE_MODERATION_ENDPOINT="https://${CONTROLLER_FQDN}/v1/moderate" \
            AZURE_MODERATION_SECRET="$AZURE_MODERATION_SECRET" \
            --project-ref "$PROJECT_REF"
