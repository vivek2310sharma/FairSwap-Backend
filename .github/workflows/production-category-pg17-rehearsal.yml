name: Production hidden-category PG17 45-to-52 rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-category-pg17-rehearsal.yml'
      - 'scripts/ci/production-category-rehearsal.mjs'
      - 'scripts/ci/production-category-rehearsal.test.mjs'
      - 'scripts/ci/run-production-category-rehearsal.sh'
      - 'scripts/ci/start-production-category-postgres-cron-off.mjs'
      - 'scripts/ci/start-production-category-postgres-cron-off.test.mjs'
      - 'releases/production/category-foundation-v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-hidden-category-pg17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-rehearsal:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'vivek2310sharma/FairSwap-Backend' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/prod-category-45-to-52-pg17-rehearsal-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout unprivileged PR source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node for immutable source verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          check-latest: false

      - name: Fail-closed static integrity and negative staging tests
        timeout-minutes: 3
        run: |
          test "$(node -p process.versions.node)" = 24.15.0
          bash -n scripts/ci/run-production-category-rehearsal.sh
          node scripts/ci/verify-production-category-release.mjs
          node --test scripts/ci/verify-production-category-release.test.mjs \
            scripts/ci/production-category-rehearsal.test.mjs \
            scripts/ci/start-production-category-postgres-cron-off.test.mjs

      - name: Execute exact local PG17 45-to-52 rehearsal and regression tests
        timeout-minutes: 33
        run: |
          # No Supabase access token, hosted connection string, keys or secrets.
          # Privileged credentials are NEVER passed into this child process.
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" CI=true GITHUB_ACTIONS=true \
            RUNNER_TEMP="$RUNNER_TEMP" \
            timeout --signal=TERM --kill-after=30s 29m \
            bash scripts/ci/run-production-category-rehearsal.sh \
            "$RUNNER_TEMP/prod-category-rehearsal-evidence"

      - name: Verify sanitized evidence and checksum
        if: always()
        id: evidence
        timeout-minutes: 1
        run: |
          dir="$RUNNER_TEMP/prod-category-rehearsal-evidence"
          if [[ -f "$dir/result.json" && -f "$dir/SHA256SUMS" ]]; then
            ( cd "$dir" && sha256sum -c SHA256SUMS )
            node --input-type=module - "$dir/result.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const allowed=['schemaVersion','releaseId','kind','success','phase','cleanupVerified','hostedWrites','backupVerified','productionApproved'];
          if(JSON.stringify(Object.keys(report).sort())!==JSON.stringify(allowed.sort()))process.exit(1);
          if(report.releaseId!=='category-foundation-v1'||report.kind!=='ISOLATED_PG17_45_TO_52'||report.hostedWrites!==false||report.backupVerified!==false||report.productionApproved!==false)process.exit(1);
          console.log('Sanitized rehearsal evidence:',JSON.stringify(report));
          NODE
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Rehearsal evidence missing; do not claim a pass'
          fi

      - name: Upload only sanitized evidence (no SQL logs, data or secrets)
        if: always() && steps.evidence.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: category-pg17-45-to-52-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prod-category-rehearsal-evidence/result.json
            ${{ runner.temp }}/prod-category-rehearsal-evidence/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
