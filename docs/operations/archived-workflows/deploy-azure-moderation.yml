name: Deploy Azure Moderation ACA (Public GHCR & OIDC)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target scope: test-and-prod (default) or test-only'
        required: true
        default: 'test-and-prod'
        type: choice
        options:
          - test-and-prod
          - test-only

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Build, CI, Publish Public GHCR Images, and Verify Package Availability
  # ---------------------------------------------------------------------------
  build-ci-and-publish:
    # Provider deployment is inactive. Keep the downstream environment-bound OIDC subjects.
    if: ${{ false }}
    name: Build, Test & Publish Public GHCR Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      controller_digest: ${{ steps.build-controller.outputs.digest }}
      vision_digest: ${{ steps.build-vision.outputs.digest }}
      ocr_digest: ${{ steps.build-ocr.outputs.digest }}
      controller_image: ghcr.io/${{ github.repository_owner }}/fairswap-moderation-controller@${{ steps.build-controller.outputs.digest }}
      vision_image: ghcr.io/${{ github.repository_owner }}/fairswap-node-vision@${{ steps.build-vision.outputs.digest }}
      ocr_image: ghcr.io/${{ github.repository_owner }}/fairswap-python-ocr@${{ steps.build-ocr.outputs.digest }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Run Backend verification, unit tests, and Azure moderation tests
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm verify:migrations
          corepack pnpm typecheck
          corepack pnpm test:unit
          corepack pnpm exec vitest run --config vitest.moderation-azure.config.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push immutable container images to public GHCR
      - name: Build and Push Controller Image
        id: build-controller
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/controller
          file: ./services/moderation-azure/controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fairswap-moderation-controller:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fairswap-moderation-controller:latest

      - name: Build and Push Node Vision Image
        id: build-vision
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/node-vision
          file: ./services/moderation-azure/node-vision/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fairswap-node-vision:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fairswap-node-vision:latest

      - name: Build and Push Python OCR Image
        id: build-ocr
        uses: docker/build-push-action@v5
        with:
          context: ./services/moderation-azure/python-ocr
          file: ./services/moderation-azure/python-ocr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fairswap-python-ocr:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fairswap-python-ocr:latest

      # Mandatory Security Gate: All three packages MUST be accessible for anonymous unauthenticated pull (FAIL CLOSED)
      - name: Verify Anonymous Pull Succeeds on All Three Public Packages (Fail-Closed)
        run: |
          set -euo pipefail
          echo "Verifying anonymous image pulls succeed for all three public packages..."
          ANON_DOCKER_CONFIG="$(mktemp -d /tmp/docker-anon-XXXXXX)"
          trap 'rm -rf "$ANON_DOCKER_CONFIG"' EXIT
          export DOCKER_CONFIG="$ANON_DOCKER_CONFIG"
          docker logout ghcr.io || true

          PACKAGES=(
            "fairswap-moderation-controller"
            "fairswap-node-vision"
            "fairswap-python-ocr"
          )

          for pkg in "${PACKAGES[@]}"; do
            IMG="ghcr.io/${{ github.repository_owner }}/$pkg:${{ github.sha }}"
            echo "Checking anonymous pull success for: $IMG"
            if docker pull "$IMG" 2>&1 | tee /tmp/pull_out.txt; then
              echo "PASS: Anonymous pull succeeded for $pkg ($IMG)."
            else
              echo "::error::SECURITY / AVAILABILITY VIOLATION: Anonymous pull failed for public package $pkg!"
              cat /tmp/pull_out.txt || true
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # Phase 2: Deploy Test Environment (Preserving FairSwapTest)
  # ---------------------------------------------------------------------------
  deploy-test:
    name: Deploy Test (FairSwapTest)
    needs: build-ci-and-publish
    runs-on: ubuntu-latest
    environment: FairSwapTest
    permissions:
      id-token: write
      contents: read
    outputs:
      controller_fqdn: ${{ steps.bicep-test.outputs.controllerFqdn }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_MODERATION_SECRET: ${{ secrets.AZURE_MODERATION_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID OPENAI_API_KEY AZURE_MODERATION_SECRET; do
            if [[ -z "${!secret_name}" ]]; then
              printf '::error::Missing required secret: %s\n' "$secret_name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Public Image Pulls in Test Environment (Fail-Closed)
        run: |
          set -euo pipefail
          echo "Verifying public image pull capability in Test runner without credentials..."
          TEST_DOCKER_CONFIG="$(mktemp -d /tmp/docker-test-XXXXXX)"
          trap 'rm -rf "$TEST_DOCKER_CONFIG"' EXIT
          export DOCKER_CONFIG="$TEST_DOCKER_CONFIG"
          docker logout ghcr.io || true

          PACKAGES=(
            "fairswap-moderation-controller"
            "fairswap-node-vision"
            "fairswap-python-ocr"
          )

          for pkg in "${PACKAGES[@]}"; do
            IMG="ghcr.io/${{ github.repository_owner }}/$pkg:${{ github.sha }}"
            echo "Verifying unauthenticated pull for: $IMG"
            if docker pull "$IMG" 2>&1 | tee /tmp/test_pull_out.txt; then
              echo "PASS: Public pull succeeded for $pkg."
            else
              echo "::error::Public image pull failed for $pkg in Test runner!"
              cat /tmp/test_pull_out.txt || true
              exit 1
            fi
          done

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group Exists
        run: |
          az group create --name rg-fairswap-moderation-test --location centralindia

      - name: Deploy Azure Container Apps via main.bicep (Test)
        id: bicep-test
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-fairswap-moderation-test
          template: infra/azure/moderation/main.bicep
          parameters: >-
            environment=test
            location=centralindia
            controllerImage=${{ needs.build-ci-and-publish.outputs.controller_image }}
            nodeVisionImage=${{ needs.build-ci-and-publish.outputs.vision_image }}
            pythonOcrImage=${{ needs.build-ci-and-publish.outputs.ocr_image }}
            openAiApiKey=${{ secrets.OPENAI_API_KEY }}
            moderationSecret=${{ secrets.AZURE_MODERATION_SECRET }}
            allowedStorageHost=wpppxlnbzqynvhpeuavd.supabase.co

  # ---------------------------------------------------------------------------
  # Phase 3: Rigorous Automated Test Verification (Fail-Closed)
  # ---------------------------------------------------------------------------
  verify-test:
    name: Verify Test Deployment & Rigorous Gates
    needs: [build-ci-and-publish, deploy-test]
    runs-on: ubuntu-latest
    environment: FairSwapTest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Gate 1: Assert configured images equal built immutable digests on ALL THREE apps
      - name: Assert Exact Built Image Digests on All Three Apps (Test)
        env:
          EXP_CTRL: ${{ needs.build-ci-and-publish.outputs.controller_image }}
          EXP_VISION: ${{ needs.build-ci-and-publish.outputs.vision_image }}
          EXP_OCR: ${{ needs.build-ci-and-publish.outputs.ocr_image }}
        run: |
          set -euo pipefail
          echo "Verifying deployed image digests match built SHA-256 digests exactly..."

          ACT_CTRL=$(az containerapp show --name ca-moderation-controller-test --resource-group rg-fairswap-moderation-test --query "properties.template.containers[0].image" -o tsv)
          ACT_VISION=$(az containerapp show --name ca-node-vision-test --resource-group rg-fairswap-moderation-test --query "properties.template.containers[0].image" -o tsv)
          ACT_OCR=$(az containerapp show --name ca-python-ocr-test --resource-group rg-fairswap-moderation-test --query "properties.template.containers[0].image" -o tsv)

          if [[ -z "$ACT_CTRL" || -z "$ACT_VISION" || -z "$ACT_OCR" ]]; then
            echo "::error::One or more image queries returned empty or null!"
            exit 1
          fi

          echo "Controller: Expected=$EXP_CTRL, Actual=$ACT_CTRL"
          echo "Node Vision: Expected=$EXP_VISION, Actual=$ACT_VISION"
          echo "Python OCR: Expected=$EXP_OCR, Actual=$ACT_OCR"

          if [[ "$ACT_CTRL" != "$EXP_CTRL" ]]; then
            echo "::error::Controller image mismatch! Expected $EXP_CTRL but found $ACT_CTRL"
            exit 1
          fi
          if [[ "$ACT_VISION" != "$EXP_VISION" ]]; then
            echo "::error::Node Vision image mismatch! Expected $EXP_VISION but found $ACT_VISION"
            exit 1
          fi
          if [[ "$ACT_OCR" != "$EXP_OCR" ]]; then
            echo "::error::Python OCR image mismatch! Expected $EXP_OCR but found $ACT_OCR"
            exit 1
          fi
          echo "PASS: All three apps are running the exact expected SHA-256 digests."

      # Gate 2: Assert scale-to-zero (minReplicas == 0) and ingress boundaries on ALL THREE apps
      - name: Assert Scale-to-Zero and Ingress Boundaries on All Three Apps (Test)
        run: |
          set -euo pipefail
          APPS=("ca-moderation-controller-test" "ca-node-vision-test" "ca-python-ocr-test")

          for app in "${APPS[@]}"; do
            MIN_REP=$(az containerapp show --name "$app" --resource-group rg-fairswap-moderation-test --query "properties.template.scale.minReplicas" -o tsv)
            echo "App $app minReplicas: $MIN_REP"
            if [[ -z "$MIN_REP" || "$MIN_REP" != "0" ]]; then
              echo "::error::App $app minReplicas is '$MIN_REP' (must be exactly 0 for scale-to-zero)!"
              exit 1
            fi
          done

          # Assert internal ingress on vision and ocr
          VISION_EXT=$(az containerapp show --name ca-node-vision-test --resource-group rg-fairswap-moderation-test --query "properties.configuration.ingress.external" -o tsv)
          OCR_EXT=$(az containerapp show --name ca-python-ocr-test --resource-group rg-fairswap-moderation-test --query "properties.configuration.ingress.external" -o tsv)
          CTRL_EXT=$(az containerapp show --name ca-moderation-controller-test --resource-group rg-fairswap-moderation-test --query "properties.configuration.ingress.external" -o tsv)

          if [[ -z "$VISION_EXT" || -z "$OCR_EXT" || -z "$CTRL_EXT" ]]; then
            echo "::error::One or more ingress queries returned empty or null!"
            exit 1
          fi

          if [[ "$VISION_EXT" != "false" ]]; then
            echo "::error::Node Vision has external ingress enabled! Must be internal only."
            exit 1
          fi
          if [[ "$OCR_EXT" != "false" ]]; then
            echo "::error::Python OCR has external ingress enabled! Must be internal only."
            exit 1
          fi
          if [[ "$CTRL_EXT" != "true" ]]; then
            echo "::error::Controller must have external ingress enabled for Supabase dispatch."
            exit 1
          fi
          echo "PASS: Scale-to-zero and ingress boundaries verified on all three apps."

      # Gate 3: Probe Controller Cold Start Wake-up
      - name: Verify Azure Controller Health & Cold Start
        shell: bash
        timeout-minutes: 3
        env:
          CONTROLLER_FQDN: ${{ needs.deploy-test.outputs.controller_fqdn }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --retry-max-time 120 \
            "https://${CONTROLLER_FQDN:?Missing controller FQDN}/healthz"
          echo "PASS: Controller /healthz responded successfully."

      # Gate 4: Verify Fail-Closed Authentication on Controller
      - name: Verify Controller Authentication Boundary (Fail-Closed 401)
        env:
          CONTROLLER_FQDN: ${{ needs.deploy-test.outputs.controller_fqdn }}
        run: |
          set -euo pipefail
          echo "Verifying unauthenticated POST receives 401..."
          UNAUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$CONTROLLER_FQDN/v1/moderate" -H "Content-Type: application/json" -d '{}' || true)
          if [[ "$UNAUTH_CODE" != "401" ]]; then
            echo "::error::Unauthenticated POST returned HTTP $UNAUTH_CODE instead of 401 Unauthorized."
            exit 1
          fi
          echo "PASS: Unauthenticated access blocked with 401."

      # Gate 5: Probe Live Replica State Evidence & Cold-Wake Check
      - name: Capture Live Container Apps Replica State Evidence (Test)
        shell: bash
        env:
          CONTROLLER_FQDN: ${{ needs.deploy-test.outputs.controller_fqdn }}
        run: |
          set -euo pipefail
          echo "Auditing live replica states and cold-wake behavior across Test Container Apps..."
          APPS=("ca-moderation-controller-test" "ca-node-vision-test" "ca-python-ocr-test")

          # Safe replica querying: never treat CLI errors, empty responses, or non-integer values as 0
          query_replicas() {
            local app_name="$1"
            local raw_count
            if ! raw_count=$(az containerapp replica list --name "$app_name" --resource-group rg-fairswap-moderation-test --query "length(@)" -o tsv 2>/dev/null); then
              echo "QUERY_FAILED"
              return 0
            fi
            raw_count=$(echo "$raw_count" | tr -d '[:space:]')
            if [[ ! "$raw_count" =~ ^[0-9]+$ ]]; then
              echo "MALFORMED_OUTPUT"
              return 0
            fi
            echo "$raw_count"
          }

          echo "Observing replica scaling towards zero (bounded 60s window)..."
          POLL_ZERO_CONFIRMED=false
          QUERY_FAILURE_DETECTED=false
          LAST_CTRL_COUNT="unknown"
          LAST_VIS_COUNT="unknown"
          LAST_OCR_COUNT="unknown"

          for i in {1..6}; do
            C=$(query_replicas "ca-moderation-controller-test")
            V=$(query_replicas "ca-node-vision-test")
            O=$(query_replicas "ca-python-ocr-test")

            if [[ "$C" == "QUERY_FAILED" || "$C" == "MALFORMED_OUTPUT" || \
                  "$V" == "QUERY_FAILED" || "$V" == "MALFORMED_OUTPUT" || \
                  "$O" == "QUERY_FAILED" || "$O" == "MALFORMED_OUTPUT" ]]; then
              echo "Poll $i/6: Replica query failed or malformed (Controller: $C, Vision: $V, OCR: $O)"
              QUERY_FAILURE_DETECTED=true
              LAST_CTRL_COUNT="$C"
              LAST_VIS_COUNT="$V"
              LAST_OCR_COUNT="$O"
              sleep 10
              continue
            fi

            LAST_CTRL_COUNT="$C"
            LAST_VIS_COUNT="$V"
            LAST_OCR_COUNT="$O"
            echo "Poll $i/6: Controller=$C, Vision=$V, OCR=$O active replicas"

            if [[ "$C" == "0" && "$V" == "0" && "$O" == "0" ]]; then
              POLL_ZERO_CONFIRMED=true
              break
            fi
            sleep 10
          done

          if [[ "$POLL_ZERO_CONFIRMED" == "true" ]]; then
            echo "All 3 apps confirmed at 0 replicas. Probing Controller /healthz to test cold wake-up..."
            curl --fail --silent --show-error --output /dev/null \
              --connect-timeout 10 --max-time 30 \
              "https://${CONTROLLER_FQDN}/healthz"
            sleep 5

            POST_CTRL=$(query_replicas "ca-moderation-controller-test")
            echo "Post-probe Controller replica count: $POST_CTRL"
            if [[ "$POST_CTRL" =~ ^[0-9]+$ ]] && [[ "$POST_CTRL" -gt 0 ]]; then
              echo "PASS: True scale-from-zero cold activation verified on Controller (replicas transitioned 0 -> $POST_CTRL)."
            else
              echo "NOTICE: Controller /healthz responded successfully; replica count was '$POST_CTRL' during post-probe window. Cold-wake activation transition classified UNVERIFIED in short observation window; minReplicas: 0 configuration is asserted."
            fi
          elif [[ "$QUERY_FAILURE_DETECTED" == "true" && "$POLL_ZERO_CONFIRMED" == "false" ]]; then
            echo "NOTICE: Azure CLI replica query failed or returned malformed output during observation window (Controller: $LAST_CTRL_COUNT, Vision: $LAST_VIS_COUNT, OCR: $LAST_OCR_COUNT). Replica state query UNVERIFIED; minReplicas: 0 configuration is asserted."
          else
            echo "NOTICE: App replicas did not reach zero within the 60s bounded CI window (Controller: $LAST_CTRL_COUNT, Vision: $LAST_VIS_COUNT, OCR: $LAST_OCR_COUNT). Scale-from-zero transition classified UNVERIFIED in short CI window; minReplicas: 0 configuration is asserted."
          fi

      # Gate 6: Verify Supabase Edge Function Security Gate
      - name: Verify Supabase Edge Function Security Gate (Test)
        run: |
          set -euo pipefail
          PROJECT_REF="wpppxlnbzqynvhpeuavd"
          echo "Verifying process-listing-moderation denies unauthenticated requests with 401..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${PROJECT_REF}.supabase.co/functions/v1/process-listing-moderation" || true)
          if [[ "$HTTP_CODE" != "401" ]]; then
            echo "::error::process-listing-moderation returned HTTP $HTTP_CODE instead of 401 Unauthorized."
            exit 1
          fi
          echo "PASS: process-listing-moderation fail-closed authentication gate verified."

  # ---------------------------------------------------------------------------
  # Phase 4: Deploy Production Environment (Consumes Verified Image Digests)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy Production (FairSwapProd)
    needs: [build-ci-and-publish, deploy-test, verify-test]
    if: ${{ inputs.target != 'test-only' }}
    runs-on: ubuntu-latest
    environment: FairSwapProd
    permissions:
      id-token: write
      contents: read
    outputs:
      controller_fqdn: ${{ steps.bicep-prod.outputs.controllerFqdn }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_MODERATION_SECRET: ${{ secrets.AZURE_MODERATION_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID OPENAI_API_KEY AZURE_MODERATION_SECRET; do
            if [[ -z "${!secret_name}" ]]; then
              printf '::error::Missing required secret: %s\n' "$secret_name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Public Image Pulls in Production Environment (Fail-Closed)
        run: |
          set -euo pipefail
          echo "Verifying public image pull capability in Production runner without credentials..."
          PROD_DOCKER_CONFIG="$(mktemp -d /tmp/docker-prod-XXXXXX)"
          trap 'rm -rf "$PROD_DOCKER_CONFIG"' EXIT
          export DOCKER_CONFIG="$PROD_DOCKER_CONFIG"
          docker logout ghcr.io || true

          PACKAGES=(
            "fairswap-moderation-controller"
            "fairswap-node-vision"
            "fairswap-python-ocr"
          )

          for pkg in "${PACKAGES[@]}"; do
            IMG="ghcr.io/${{ github.repository_owner }}/$pkg:${{ github.sha }}"
            echo "Verifying unauthenticated pull for: $IMG"
            if docker pull "$IMG" 2>&1 | tee /tmp/prod_pull_out.txt; then
              echo "PASS: Public pull succeeded for $pkg."
            else
              echo "::error::Public image pull failed for $pkg in Production runner!"
              cat /tmp/prod_pull_out.txt || true
              exit 1
            fi
          done

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group Exists
        run: |
          az group create --name rg-fairswap-moderation-prod --location centralindia

      - name: Deploy Azure Container Apps to Production via main.bicep (Identical Digests)
        id: bicep-prod
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-fairswap-moderation-prod
          template: infra/azure/moderation/main.bicep
          parameters: >-
            environment=prod
            location=centralindia
            controllerImage=${{ needs.build-ci-and-publish.outputs.controller_image }}
            nodeVisionImage=${{ needs.build-ci-and-publish.outputs.vision_image }}
            pythonOcrImage=${{ needs.build-ci-and-publish.outputs.ocr_image }}
            openAiApiKey=${{ secrets.OPENAI_API_KEY }}
            moderationSecret=${{ secrets.AZURE_MODERATION_SECRET }}
            allowedStorageHost=kriuhwppxgxsyyrbjsau.supabase.co

  # ---------------------------------------------------------------------------
  # Phase 5: Automated Production Postflight Verification
  # ---------------------------------------------------------------------------
  verify-prod:
    name: Verify Production Postflight & Rigorous Gates
    needs: [build-ci-and-publish, deploy-prod]
    if: ${{ inputs.target != 'test-only' }}
    runs-on: ubuntu-latest
    environment: FairSwapProd
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Gate 1: Assert exact image digests on all three Production apps
      - name: Assert Exact Built Image Digests on All Three Apps (Production)
        env:
          EXP_CTRL: ${{ needs.build-ci-and-publish.outputs.controller_image }}
          EXP_VISION: ${{ needs.build-ci-and-publish.outputs.vision_image }}
          EXP_OCR: ${{ needs.build-ci-and-publish.outputs.ocr_image }}
        run: |
          set -euo pipefail
          echo "Verifying Production image digests match built SHA-256 digests..."

          ACT_CTRL=$(az containerapp show --name ca-moderation-controller-prod --resource-group rg-fairswap-moderation-prod --query "properties.template.containers[0].image" -o tsv)
          ACT_VISION=$(az containerapp show --name ca-node-vision-prod --resource-group rg-fairswap-moderation-prod --query "properties.template.containers[0].image" -o tsv)
          ACT_OCR=$(az containerapp show --name ca-python-ocr-prod --resource-group rg-fairswap-moderation-prod --query "properties.template.containers[0].image" -o tsv)

          if [[ -z "$ACT_CTRL" || -z "$ACT_VISION" || -z "$ACT_OCR" ]]; then
            echo "::error::One or more production image queries returned empty or null!"
            exit 1
          fi

          if [[ "$ACT_CTRL" != "$EXP_CTRL" ]]; then
            echo "::error::Production Controller image mismatch! Expected $EXP_CTRL but found $ACT_CTRL"
            exit 1
          fi
          if [[ "$ACT_VISION" != "$EXP_VISION" ]]; then
            echo "::error::Production Node Vision image mismatch! Expected $EXP_VISION but found $ACT_VISION"
            exit 1
          fi
          if [[ "$ACT_OCR" != "$EXP_OCR" ]]; then
            echo "::error::Production Python OCR image mismatch! Expected $EXP_OCR but found $ACT_OCR"
            exit 1
          fi
          echo "PASS: All three Production apps running verified SHA-256 digests."

      # Gate 2: Assert scale-to-zero and ingress boundaries on Production apps
      - name: Assert Scale-to-Zero and Ingress Boundaries (Production)
        run: |
          set -euo pipefail
          APPS=("ca-moderation-controller-prod" "ca-node-vision-prod" "ca-python-ocr-prod")

          for app in "${APPS[@]}"; do
            MIN_REP=$(az containerapp show --name "$app" --resource-group rg-fairswap-moderation-prod --query "properties.template.scale.minReplicas" -o tsv)
            if [[ -z "$MIN_REP" || "$MIN_REP" != "0" ]]; then
              echo "::error::Production app $app minReplicas is '$MIN_REP' (must be exactly 0)!"
              exit 1
            fi
          done

          VISION_EXT=$(az containerapp show --name ca-node-vision-prod --resource-group rg-fairswap-moderation-prod --query "properties.configuration.ingress.external" -o tsv)
          OCR_EXT=$(az containerapp show --name ca-python-ocr-prod --resource-group rg-fairswap-moderation-prod --query "properties.configuration.ingress.external" -o tsv)
          CTRL_EXT=$(az containerapp show --name ca-moderation-controller-prod --resource-group rg-fairswap-moderation-prod --query "properties.configuration.ingress.external" -o tsv)

          if [[ -z "$VISION_EXT" || -z "$OCR_EXT" || -z "$CTRL_EXT" ]]; then
            echo "::error::One or more production ingress queries returned empty or null!"
            exit 1
          fi

          if [[ "$VISION_EXT" != "false" ]]; then
            echo "::error::Production Node Vision has external ingress enabled!"
            exit 1
          fi
          if [[ "$OCR_EXT" != "false" ]]; then
            echo "::error::Production Python OCR has external ingress enabled!"
            exit 1
          fi
          if [[ "$CTRL_EXT" != "true" ]]; then
            echo "::error::Production Controller must have external ingress enabled."
            exit 1
          fi
          echo "PASS: Production scale-to-zero and ingress boundaries verified."

      # Gate 3: Probe Production Controller Cold Start
      - name: Verify Production Controller Health & Cold Start
        shell: bash
        timeout-minutes: 3
        env:
          CONTROLLER_FQDN: ${{ needs.deploy-prod.outputs.controller_fqdn }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --retry-max-time 120 \
            "https://${CONTROLLER_FQDN:?Missing controller FQDN}/healthz"
          echo "PASS: Production Controller /healthz responded successfully."

      # Gate 4: Verify Fail-Closed Authentication on Production Controller
      - name: Verify Production Controller Authentication Boundary
        env:
          CONTROLLER_FQDN: ${{ needs.deploy-prod.outputs.controller_fqdn }}
        run: |
          set -euo pipefail
          UNAUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$CONTROLLER_FQDN/v1/moderate" -H "Content-Type: application/json" -d '{}' || true)
          if [[ "$UNAUTH_CODE" != "401" ]]; then
            echo "::error::Production unauthenticated POST returned HTTP $UNAUTH_CODE instead of 401."
            exit 1
          fi
          echo "PASS: Production unauthenticated access blocked with 401."

      # Gate 5: Verify Supabase Edge Function Fail-Closed Gate (Production)
      - name: Verify Supabase Edge Function Security Gate (Production)
        run: |
          set -euo pipefail
          PROJECT_REF="kriuhwppxgxsyyrbjsau"
          echo "Verifying Production process-listing-moderation denies unauthenticated requests with 401..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${PROJECT_REF}.supabase.co/functions/v1/process-listing-moderation" || true)
          if [[ "$HTTP_CODE" != "401" ]]; then
            echo "::error::Production process-listing-moderation returned HTTP $HTTP_CODE instead of 401 Unauthorized."
            exit 1
          fi
          echo "PASS: Production process-listing-moderation fail-closed authentication gate verified."
